---
layout: default
---
<div class="post-header">
  <div class="wrap">
    <h1>{{ page.title }}</h1>
    {% if page.description %}
    <p style="color:var(--muted);font-size:16px;max-width:720px;margin-top:12px">{{ page.description }}</p>
    {% endif %}
  </div>
</div>
<div class="post-content">
  {{ content }}
</div>
